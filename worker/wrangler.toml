name = "rss-reader-poller"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Runs every 30 minutes. Adjust to taste — e.g. "*/15 * * * *" for every 15 min.
[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "rss-reader"
database_id = "9b91e1cb-53fd-4035-84ce-97b69b9c0097"

# Optional: set with `wrangler secret put REFRESH_SECRET` to protect the
# manual POST /refresh endpoint. If unset, /refresh is open to anyone who
# knows the worker's URL — fine for a workers.dev URL you keep private,
# but set this if you want a real lock on it.
